name: auto-queue
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
jobs:
  enableAutoQueue:
    name: "Set AutoQueue on PR #${{ github.event.number }}"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    if: github.event.action != 'synchronize' || (!github.event.pull_request.draft && contains(github.event.pull_request.labels.*.name, 'auto-approve') && github.event.pull_request.user.login == 'cdk8s-automation')
    steps:
      - id: auto-queue-pr
        env:
          GH_TOKEN: ${{ secrets.PROJEN_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
        run: gh pr merge --auto --squash "$PR_NUMBER" --repo "$GH_REPO"
