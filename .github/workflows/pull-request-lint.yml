name: pull-request-lint
on:
  pull_request_target:
    types:
      - labeled
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
  merge_group: {}
jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    if: (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
    steps:
      - id: validate-pr-title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |-
            feat
            fix
            chore
            docs
          requireScope: false
  pull-request-lint:
    needs: validate
    runs-on: ubuntu-latest
    permissions: {}
    if: always()
    steps:
      - name: validate result
        id: validate_result
        run: echo ${{ needs.validate.result }}
      - name: Set status based on pull request checks
        id: set_status_based_on_pull_request_checks
        if: ${{ (needs.validate.result != 'success' && needs.validate.result != 'skipped') }}
        run: exit 1
